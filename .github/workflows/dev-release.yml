name: development release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to release. Defaults to the workflow ref.
        required: false
        type: string
      release_bump:
        description: Base version bump for the prerelease.
        required: true
        default: minor
        type: choice
        options:
          - minor
          - patch
          - major

permissions:
  contents: write

concurrency:
  group: development-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Compute development tag
        id: version
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
          RELEASE_BUMP: ${{ inputs.release_bump }}
        run: |
          release_ref="${RELEASE_REF}"
          tag="$(.github/scripts/next-dev-tag.sh "${RELEASE_BUMP}" "${release_ref}" "${GITHUB_RUN_NUMBER}")"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi

      - name: Create development tag
        env:
          DEV_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${DEV_TAG}" -m "Development release ${DEV_TAG}"
          git push origin "${DEV_TAG}"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
